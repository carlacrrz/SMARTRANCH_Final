version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart_ranch_mqtt
    ports:
      - "1883:1883"   # MQTT native
      - "9001:9001"   # MQTT over WebSocket (for Flutter web)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    container_name: smart_ranch_influx
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD:-smartranch2026}
      - DOCKER_INFLUXDB_INIT_ORG=smart_ranch
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-smart-ranch-dev-token}
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    container_name: smart_ranch_pg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=smart_ranch
      - POSTGRES_USER=ranch_admin
      - POSTGRES_PASSWORD=${PG_PASSWORD:-smartranch2026}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11-ubuntu
    container_name: smart_ranch_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-smartranch2026}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/smart_ranch.json
    depends_on:
      - influxdb
      - postgres
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  postgres_data:
  grafana_data:

