; Smart Ranch — PlatformIO Configuration
; ESP32 Wearable Cattle Monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Dependencies
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
